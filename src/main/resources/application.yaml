server:
    port: 8080

spring:
    application:
        name: telemetry-api
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
    flyway:
        enabled: true
        baseline-on-migrate: true

management:
    endpoints:
        web:
            exposure:
                include: health, prometheus
    endpoint:
        health:
            show-details: always
    metrics:
        tags:
            application: ${spring.application.name}
        distribuition:
            percentiles-histogram:
                http:
                    server:
                        request: true
        data:
            repository:
                autotime:
                    enabled: true
api:
    security:
        telemetry-key: ${TELEMETRY_API_KEY}


