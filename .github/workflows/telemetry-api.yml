name: telemetry-api

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'Dockerfile'
      - '.github/workflows/telemetry-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build application with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-api:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_HOOK_API }}
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/telemetry-api:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$HOOK" ]]; then
            echo "::error::O secret RENDER_HOOK_API esta vazio ou indisponivel."
            exit 1
          fi
          if [[ "$HOOK" =~ [[:space:]] ]] || [[ ! "$HOOK" =~ ^https://api\.render\.com/deploy/[^/?\#]+\?key=[^\&\#]+$ ]]; then
            echo "::error::RENDER_HOOK_API deve conter apenas a URL completa do Deploy Hook do Render, sem aspas, espacos ou quebras de linha."
            exit 1
          fi
          curl -fsS --get --url "$HOOK" --data-urlencode "imgURL=$IMAGE_URL"
