name: telemetry-infra

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/telemetry-infra.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres-exporter
            hook: RENDER_HOOK_POSTGRES_EXPORTER
          - image: prometheus
            hook: RENDER_HOOK_PROMETHEUS
          - image: grafana
            hook: RENDER_HOOK_GRAFANA
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=false
          for credential in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::O secret $credential esta vazio ou indisponivel. Configure em Settings > Secrets and variables > Actions."
              missing=true
            fi
          done
          if [[ "$missing" == true ]]; then
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/${{ matrix.image }}
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trigger Render deploy for ${{ matrix.image }}
        env:
          HOOK: ${{ secrets[matrix.hook] }}
          HOOK_NAME: ${{ matrix.hook }}
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$HOOK" ]]; then
            echo "::error::O secret $HOOK_NAME esta vazio ou indisponivel."
            exit 1
          fi
          if [[ "$HOOK" =~ [[:space:]] ]] || [[ ! "$HOOK" =~ ^https://api\.render\.com/deploy/[^/?\#]+\?key=[^\&\#]+$ ]]; then
            echo "::error::O secret $HOOK_NAME deve conter apenas a URL completa do Deploy Hook do Render, sem aspas, espacos ou quebras de linha."
            exit 1
          fi
          curl -fsS --get --url "$HOOK" --data-urlencode "imgURL=$IMAGE_URL"
